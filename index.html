<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- BÀI TẬP 1  -->
    <h3>Bài tập 1 - Quản lý tuyển sinh</h3>
    <input id="diemChuan" type="text" placeholder="Điểm chuẩn" />
    <select id="khuVuc">
      <option value="">-- Chọn khu vực --</option>
      <option value="A">Khu vực A</option>
      <option value="B">Khu vực B</option>
      <option value="C">Khu vực C</option>
      <option value="0">Không thuộc khu vực</option>
    </select>
    <select id="doiTuong">
      <option value="">-- Chọn đối tượng --</option>
      <option value="1">Đối tượng 1</option>
      <option value="2">Đối tượng 2</option>
      <option value="3">Đối tượng 3</option>
      <option value="0">Không thuộc đối tượng</option>
    </select>
    <br /><br />
    <input id="mon_1" type="number" placeholder="Điểm chuẩn môn 1" />
    <input id="mon_2" type="number" placeholder="Điểm chuẩn môn 2" />
    <input id="mon_3" type="number" placeholder="Điểm chuẩn môn 3" />
    <br /><br />
    <button id="btnKetQua">Kết quả</button>
    <br /><br />
    <div id="showInfo_1"></div>
    <hr />

    <!-- BÀI TẬP 2 -->
    <h3>Bài tập 2 - Tính tiền điện</h3>
    <input id="hoTen" type="text" placeholder="Nhập họ tên" />
    <input id="soKw" type="number" placeholder="Nhập số kw" />
    <button id="btnTinhTienDien">Tính tiền điện</button>
    <div id="showInfo_2"></div>
    <hr />

    <!-- TÍNH THUẾ THU NHẬP CÁ NHÂN -->
    <h3>Bài tập 3 - Tính thuế thu nhập cá nhân</h3>
    <input id="hoTen_2" type="text" placeholder="Nhập họ tên" />
    <input id="tongThuNhap" type="number" placeholder="Tổng thu nhập/ năm" />
    <input
      id="soNguoiPhuThuoc"
      type="number"
      placeholder="Số người phụ thuộc"
    />
    <button id="tinhTienThue">Tính tiền thuế</button>
    <div id="showInfo_3"></div>
    <hr />

    <!-- TÍNH TIỀN CÁP -->
    <h3>Bài tập 4 - Tính tiền cáp</h3>
    <select id="loaiKhachHang" onchange="chonLoaiKhachHang()">
      <option value="">--Chọn loại khác--</option>
      <option value="ND">Nhà Dân</option>
      <option value="DN">Doanh Nghiệp</option>
    </select>
    <input id="maKhachHang" type="text" placeholder="Mã khách hàng" />
    <input id="soKenh" type="number" placeholder="Số kênh cao cấp" />
    <div id="groupKetNoi" style="display: none">
      <input id="soKetNoi" type="number" placeholder="Số kết nối" />
    </div>
    <button id="tinhTienCap">Tính tiền cáp</button>
    <div id="showInfo_4"></div>

    <!-- SCRIPT-JS -->
    <!-- <script src="./js/bt1.js"></script> -->
    <!-- <script src="./js/bt2.js"></script> -->
    <!-- <script src="./js/bt3.js"></script> -->
    <script src="./js/bt4.js"></script>
  </body>
</html>
